<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delivery-loop-title delivery-loop-description" viewBox="0 0 1175 1268" width="1175" height="1268"><title id="delivery-loop-title">The OpenPlanr delivery loop</title><desc id="delivery-loop-description">You invoke the spec, plan, ship, and land skills inside your coding agent. Spec and plan write the plans under .planr/ in your repository; ship reads the plan first and implements one task in the source code; land assesses release readiness before you merge. The planr CLI validates the planning files offline, never by a model, and keeps GitHub Issues or Linear in step. Review skills check the change, and operate readouts return to you as evidence for the next request, which closes the loop.</desc><defs><style>@media (prefers-color-scheme: dark){[fill="#F5F7F7"]{fill:#08080C}[stroke="#F5F7F7"]{stroke:#08080C}[fill="#E8F0EF"]{fill:#0D1618}[stroke="#E8F0EF"]{stroke:#0D1618}[fill="#08080C"]{fill:#F5F7F7}[stroke="#08080C"]{stroke:#F5F7F7}[fill="#67686A"]{fill:#969799}[stroke="#67686A"]{stroke:#969799}[fill="#237A72"]{fill:#5EEAD4}[stroke="#237A72"]{stroke:#5EEAD4}[fill="#59595C"]{fill:#A4A6A7}[stroke="#59595C"]{stroke:#A4A6A7}}</style><marker id="diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67686A"/></marker></defs><rect width="1175" height="1268" fill="#F5F7F7"/><g data-group-id="loop"><rect x="561.05" y="794" width="392.5999999999999" height="410" rx="20" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="579.05" y="821" font-family="Outfit, DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.2" fill="#67686A">Review and operate</text></g><g data-group-id="agent"><rect x="64" y="290" width="1006.8" height="158" rx="20" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="82" y="317" fo