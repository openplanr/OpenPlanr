.5" y="492" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#59595C"><tspan x="487.5" y="492">writes the plan</tspan></text></g><g data-relation-id="ship-code"><path d="M 720 420 L 720 526 L 757.3499999999999 526 L 757.3499999999999 588" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="632" y="460" width="176" height="54" rx="8" fill="#F5F7F7"/><text x="720" y="482" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#59595C"><tspan x="720" y="482">implements one task</tspan><tspan x="720" y="502">plan read first</tspan></text></g><g data-relation-id="land-code"><path d="M 952.4999999999999 420 L 952.4999999999999 526 L 757.3499999999999 526 L 757.3499999999999 588" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="892.4999999999999" y="460" width="120" height="54" rx="8" fill="#F5F7F7"/><text x="952.4999999999999" y="482" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#59595C"><tspan x="952.4999999999999" y="482">readiness</tspan><tspan x="952.4999999999999" y="502">before merge</tspan></text></g><g data-relation-id="planr-cli"><path d="M 423.45 672 L 423.45 716 L 423.45 840" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="339.45" y="718" width="168" height="54" rx="8" fill="#F5F7F7"/><text x="423.45" y="740" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#59595C"><tspan x="423.45" y="740">validated offline,</tspan><tspan x="423.45" y="760">never by a model</tspan></text></g><g data-relation-id="cli-trackers"><path d="M 423.45 924 L 423.45 952 L 423.45 1092" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><r