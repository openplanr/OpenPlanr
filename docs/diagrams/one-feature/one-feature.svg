<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-feature-title one-feature-description" viewBox="0 0 1788 2002" width="1788" height="2002"><title id="one-feature-title">One feature, end to end</title><desc id="one-feature-description">You ask the coding agent for a specification for passwordless sign-in; it asks only the questions that change the outcome and writes the specification under .planr/. You ask for a plan; it writes user stories and tasks, and the planr CLI validates the cross-references offline. You ship one task at a time: the agent reads the plan first, implements and verifies the task, and records provenance; you open one pull request per task, GitHub runs CI and review, land prepares the exact merge commands, and you merge. Release writes the release entry and operate returns a readout that becomes evidence for the next specification.</desc><defs><style>@media (prefers-color-scheme: dark){[fill="#F5F7F7"]{fill:#08080C}[stroke="#F5F7F7"]{stroke:#08080C}[fill="#E8F0EF"]{fill:#0D1618}[stroke="#E8F0EF"]{stroke:#0D1618}[fill="#08080C"]{fill:#F5F7F7}[stroke="#08080C"]{stroke:#F5F7F7}[fill="#67686A"]{fill:#969799}[stroke="#67686A"]{stroke:#969799}[fill="#237A72"]{fill:#5EEAD4}[stroke="#237A72"]{stroke:#5EEAD4}[fill="#59595C"]{fill:#A4A6A7}[stroke="#59595C"]{stroke:#A4A6A7}}</style><marker id="diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67686A"/></marker></defs><rect width="1788" height="2002" fill="#F5F7F7"/><g data-phase-id="e-specify"><text x="64" y="214" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#237A72">SPECIFY</text><line x1="64" y1="224" x2="1724" y2="224" stroke="#67686A" stroke-width="1" opacity="0.28"/></g><g data-phase-id="e-plan"><text x="64" y="530" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#237A72">PLAN</text><line x1="64" y1="540" x2="1724" y2="540" stroke="#67686A" stroke-width="1" opacity="0.28"/></g><g data-phase-id="e-ship"><text x="64" y="940" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#237A72">SHIP, ONE TASK PER PR</text><line x1="64" y1="950" x2="1724" y2="950" stroke="#67686A" stroke-width="1" opacity="0.28"/></g><g data-phase-id="e-land"><text x="64" y="1314" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#237A72">LAND</text><line x1="64" y1="1324" x2="1724" y2="1324" stroke="#67686A" stroke-width="1" opacity="0.28"/></g><g data-phase-id="e-operate"><text x="64" y="1612" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#237A72">RELEASE AND OPERATE</text><line x1="64" y1="1622" x2="1724" y2="1622" stroke="#67686A" stroke-width="1" opacity="0.28"/></g><line data-lifeline-id="you" x1="350" y1="152" x2="350" y2="1938" stroke="#67686A" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.48"/><line data-lifeline-id="agent" x1="666" y1="152" x2="666" y2="1938" stroke="#67686A" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.48"/><line data-lifeline-id="repo" x1="982" y1="152" x2="982" y2="1938" stroke="#67686A" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.48"/><line data-lifeline-id="cli" x1="1298" y1="152" x2="1298" y2="1938" stroke="#67686A" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.48"/><line data-lifeline-id="github" x1="1614" y1="152" x2="1614" y2="1938" stroke="#67686A" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.48"/><g data-relation-id="m1"><path d="M 350 336 L 666 336" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="362" y="276" width="292" height="50" rx="8" fill="#F5F7F7"/><text x="508" y="294" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="294">/planr:spec &quot;Add passwordless sign-in</tspan><tspan x="508" y="312">for existing accounts&quot;</tspan></text></g><g data-relation-id="m2"><path d="M 666 430 L 350 430" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="362" y="370" width="292" height="50" rx="8" fill="#F5F7F7"/><text x="508" y="388" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="388">asks only the questions that change the</tspan><tspan x="508" y="406">outcome</tspan></text></g><g data-relation-id="m3"><path d="M 666 506 L 982 506" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="678.75" y="464" width="290.5" height="32" rx="8" fill="#F5F7F7"/><text x="824" y="482" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="824" y="482">writes SPEC-004 under .planr/specs/</tspan></text></g><g data-relation-id="m4"><path d="M 350 634 L 666 634" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="448" y="592" width="120" height="32" rx="8" fill="#F5F7F7"/><text x="508" y="610" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="610">/planr:plan</tspan></text></g><g data-relation-id="m5"><path d="M 666 746 L 982 746" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="682.5" y="668" width="283" height="68" rx="8" fill="#F5F7F7"/><text x="824" y="686" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="824" y="686">writes 3 user stories and 6 tasks:</tspan><tspan x="824" y="704">acceptance criteria and file-level</tspan><tspan x="824" y="722">change lists</tspan></text></g><g data-relation-id="m6"><path d="M 350 822 L 1298 822" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="764" y="780" width="120" height="32" rx="8" fill="#F5F7F7"/><text x="824" y="798" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="824" y="798">planr sync</tspan></text></g><g data-relation-id="m7"><path d="M 1298 916 L 982 916" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="994" y="856" width="292" height="50" rx="8" fill="#F5F7F7"/><text x="1140" y="874" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="1140" y="874">validates and repairs cross-references,</tspan><tspan x="1140" y="892">offline, never by a model</tspan></text></g><g data-relation-id="m8"><path d="M 350 1044 L 666 1044" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="415.25" y="1002" width="185.5" height="32" rx="8" fill="#F5F7F7"/><text x="508" y="1020" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="1020">/planr:ship, one task</tspan></text></g><g data-relation-id="m9"><path d="M 666 1138 L 982 1138" fill="none" stroke="#237A72" stroke-width="3" marker-end="url(#diagram-arrow)"/><rect x="678" y="1078" width="292" height="50" rx="8" fill="#F5F7F7"/><text x="824" y="1096" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="824" y="1096">reads the plan first, implements and</tspan><tspan x="824" y="1114">verifies the task, records provenance</tspan></text></g><g data-relation-id="m10"><path d="M 350 1214 L 1614 1214" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="889.25" y="1172" width="185.5" height="32" rx="8" fill="#F5F7F7"/><text x="982" y="1190" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="982" y="1190">opens one PR per task</tspan></text></g><g data-relation-id="m11"><path d="M 1614 1290 L 350 1290" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="919.25" y="1248" width="125.5" height="32" rx="8" fill="#F5F7F7"/><text x="982" y="1266" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="982" y="1266">CI and review</tspan></text></g><g data-relation-id="m12"><path d="M 350 1418 L 666 1418" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="448" y="1376" width="120" height="32" rx="8" fill="#F5F7F7"/><text x="508" y="1394" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="1394">/planr:land</tspan></text></g><g data-relation-id="m13"><path d="M 666 1512 L 350 1512" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="362" y="1452" width="292" height="50" rx="8" fill="#F5F7F7"/><text x="508" y="1470" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="1470">release readiness and the exact merge</tspan><tspan x="508" y="1488">commands; the merge stays yours</tspan></text></g><g data-relation-id="m14"><path d="M 350 1588 L 1614 1588" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="922" y="1546" width="120" height="32" rx="8" fill="#F5F7F7"/><text x="982" y="1564" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="982" y="1564">merge</tspan></text></g><g data-relation-id="m15"><path d="M 350 1716 L 666 1716" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="362.75" y="1674" width="290.5" height="32" rx="8" fill="#F5F7F7"/><text x="508" y="1692" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="1692">/planr:release, then /planr:operate</tspan></text></g><g data-relation-id="m16"><path d="M 666 1810 L 982 1810" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="678.75" y="1750" width="290.5" height="50" rx="8" fill="#F5F7F7"/><text x="824" y="1768" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="824" y="1768">classifies what shipped, writes the</tspan><tspan x="824" y="1786">release entry</tspan></text></g><g data-relation-id="m17"><path d="M 666 1904 L 350 1904" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="362" y="1844" width="292" height="50" rx="8" fill="#F5F7F7"/><text x="508" y="1862" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="508" y="1862">operate readout: decisions, actions,</tspan><tspan x="508" y="1880">risks, and evidence for the next spec</tspan></text></g><g data-item-id="you"><rect x="240" y="64" width="220" height="88" rx="14" fill="#E8F0EF" stroke="#67686A" stroke-width="2"/><text aria-label="You" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#08080C"><tspan x="350" y="113">You</tspan></text></g><g data-item-id="agent"><rect x="556" y="64" width="220" height="88" rx="14" fill="#E8F0EF" stroke="#67686A" stroke-width="2"/><text aria-label="Your coding agent" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#08080C"><tspan x="666" y="113">Your coding agent</tspan></text></g><g data-item-id="repo"><rect x="872" y="64" width="220" height="88" rx="14" fill="#E8F0EF" stroke="#67686A" stroke-width="2"/><text aria-label="Your repository" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#08080C"><tspan x="982" y="113">Your repository</tspan></text></g><g data-item-id="cli"><rect x="1188" y="64" width="220" height="88" rx="14" fill="#E8F0EF" stroke="#67686A" stroke-width="2"/><text aria-label="planr CLI" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#08080C"><tspan x="1298" y="113">planr CLI</tspan></text></g><g data-item-id="github"><rect x="1504" y="64" width="220" height="88" rx="14" fill="#E8F0EF" stroke="#67686A" stroke-width="2"/><text aria-label="GitHub" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#08080C"><tspan x="1614" y="113">GitHub</tspan></text></g></svg>
