<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planning-artifacts-title planning-artifacts-description" viewBox="0 0 1732 546" width="1732" height="546"><title id="planning-artifacts-title">OpenPlanr planning artifacts</title><desc id="planning-artifacts-description">The planr-spec, planr-plan, and planr-ship skills run inside the coding agent and write the specification, user stories, and tasks under .planr/ in the repository. The planr CLI validates those files and syncs them with GitHub Issues or Linear.</desc><defs><marker id="diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1732" height="546" fill="#ffffff"/><g data-group-id="agent"><rect x="230" y="64" width="940" height="162" rx="18" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/><text x="248" y="91" font-family="Inter" font-size="13" font-weight="700" letter-spacing="0.8" fill="#475569">Skills in your coding agent</text></g><g data-group-id="repo"><rect x="64" y="320" width="940" height="162" rx="18" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/><text x="82" y="347" font-family="Inter" font-size="13" font-weight="700" letter-spacing="0.8" fill="#475569">.planr/ in your repository</text></g><g data-group-id="trackers"><rect x="1060" y="320" width="608" height="162" rx="18" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 6"/><text x="1078" y="347" font-family="Inter" font-size="13" font-weight="700" letter-spacing="0.8" fill="#475569">Optional trackers</text></g><g data-relation-id="r1"><path d="M 368 198 L 368 242 L 202 242 L 202 366" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="148" y="266" width="108" height="32" rx="8" fill="#ffffff"/><text x="202" y="284" text-anchor="middle" font-family="Inter" font-size="14" fill="#64748b"><tspan x="202" y="284