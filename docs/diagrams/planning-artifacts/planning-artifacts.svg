<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planning-artifacts-title planning-artifacts-description" viewBox="0 0 1068 1058" width="1068" height="1058"><title id="planning-artifacts-title">OpenPlanr planning artifacts</title><desc id="planning-artifacts-description">The spec, plan, and ship skills run inside your coding agent. Spec writes the specification, plan writes the user stories and tasks that ship reads before it changes code, and ship appends each shipped task to the provenance log. All of them live under .planr/ in your repository, written by the agent and reviewed like code. The planr CLI validates those files offline, never by a model, and keeps GitHub Issues or Linear in step.</desc><defs><style>@media (prefers-color-scheme: dark){[fill="#F5F7F7"]{fill:#08080C}[stroke="#F5F7F7"]{stroke:#08080C}[fill="#E8F0EF"]{fill:#0D1618}[stroke="#E8F0EF"]{stroke:#0D1618}[fill="#08080C"]{fill:#F5F7F7}[stroke="#08080C"]{stroke:#F5F7F7}[fill="#67686A"]{fill:#969799}[stroke="#67686A"]{stroke:#969799}[fill="#237A72"]{fill:#5EEAD4}[stroke="#237A72"]{stroke:#5EEAD4}[fill="#59595C"]{fill:#A4A6A7}[stroke="#59595C"]{stroke:#A4A6A7}}</style><marker id="diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67686A"/></marker></defs><rect width="1068" height="1058" fill="#F5F7F7"/><g data-group-id="agent"><rect x="64" y="64" width="940" height="162" rx="18" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="82" y="91" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#67686A">Your coding agent · writes the plan into your repository, you review it like code</text></g><g data-group-id="repo"><rect x="64" y="320" width="940" height="162" rx="18" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="82" y="347" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#67686A">Under .planr/</text></g><g data-group-id="trackers"><rect x="230" y="832" width="608" height="162" rx="18" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="248" y="859" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8" fill="#67686A">Your tracker</text></g><g data-relation-id="r1"><path d="M 202 198 L 202 242 L 202 366" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="148" y="266" width="108" height="32" rx="8" fill="#F5F7F7"/><text x="202" y="284" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="202" y="284">writes</tspan></text></g><g data-relation-id="r2"><path d="M 534 198 L 534 242 L 534 366" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="480" y="266" width="108" height="32" rx="8" fill="#F5F7F7"/><text x="534" y="284" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="534" y="284">writes</tspan></text></g><g data-relation-id="r3"><path d="M 866 198 L 866 242 L 866 366" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="805" y="266" width="122" height="32" rx="8" fill="#F5F7F7"/><text x="866" y="284" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#59595C"><tspan x="866" y="284">appends</tspan></text></g><g data-relation-id="r4"><path d="M 202 454 L 202 594 L 534 594 L 534 622" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/></g><g data-relation-id="r5"><path d="M 534 454 L 534 594 L 534 622" 