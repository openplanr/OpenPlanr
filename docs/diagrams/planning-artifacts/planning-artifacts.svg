<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planning-artifacts-title planning-artifacts-description" viewBox="0 0 870 1042" width="870" height="1042"><title id="planning-artifacts-title">OpenPlanr planning artifacts</title><desc id="planning-artifacts-description">The spec, plan, and ship skills run inside your coding agent. Spec writes the specification, plan writes the user stories and tasks that ship reads before it changes code, and ship appends each shipped task to the provenance log. All of them live under .planr/ in your repository, written by the agent and reviewed like code. The openplanr CLI validates those files offline, never by a model, and keeps GitHub Issues or Linear in step.</desc><defs><style>@media (prefers-color-scheme: dark){[fill="#F5F7F7"]{fill:#08080C}[stroke="#F5F7F7"]{stroke:#08080C}[fill="#E8F0EF"]{fill:#0D1618}[stroke="#E8F0EF"]{stroke:#0D1618}[fill="#08080C"]{fill:#F5F7F7}[stroke="#08080C"]{stroke:#F5F7F7}[fill="#67686A"]{fill:#969799}[stroke="#67686A"]{stroke:#969799}[fill="#237A72"]{fill:#5EEAD4}[stroke="#237A72"]{stroke:#5EEAD4}[fill="#59595C"]{fill:#A4A6A7}[stroke="#59595C"]{stroke:#A4A6A7}}</style><marker id="diagram-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#67686A"/></marker></defs><rect width="870" height="1042" fill="#F5F7F7"/><g data-group-id="repo"><rect x="64" y="316" width="741.5999999999999" height="158" rx="20" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="82" y="343" font-family="Outfit, DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.2" fill="#67686A">Under .planr/</text></g><g data-group-id="agent"><rect x="84" y="64" width="718.4" height="158" rx="20" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="102" y="91" font-family="Outfit, DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.2" fill="#67686A">Your coding agent · writes the plan into your repository, you review it like code</text></g><g data-group-id="trackers"><rect x="203" y="820" width="467.66666666666663" height="158" rx="20" fill="none" stroke="#67686A" stroke-width="1.5" stroke-dasharray="8 6"/><text x="221" y="847" font-family="Outfit, DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.2" fill="#67686A">Your tracker</text></g><g data-relation-id="r1"><path d="M 200 194 L 200 238 L 200 362" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="164" y="260" width="72" height="34" rx="8" fill="#F5F7F7"/><text x="200" y="282" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#59595C"><tspan x="200" y="282">writes</tspan></text></g><g data-relation-id="r2"><path d="M 441.59999999999997 194 L 441.59999999999997 238 L 441.59999999999997 362" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="405.59999999999997" y="260" width="72" height="34" rx="8" fill="#F5F7F7"/><text x="441.59999999999997" y="282" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#59595C"><tspan x="441.59999999999997" y="282">writes</tspan></text></g><g data-relation-id="r3"><path d="M 686.3999999999999 194 L 686.3999999999999 362" fill="none" stroke="#67686A" stroke-width="2" marker-end="url(#diagram-arrow)"/><rect x="646.3999999999999" y="260" width="80" height="34" rx="8" fill="#F5F7F7"/><text x="686.3999999999999" y="282" text-anchor="middle" font-family="DM Sans, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" fill="#59595C"><tspan x="686.3999999999999" y="282">appends</tspan></text></g><g data-relation-id=