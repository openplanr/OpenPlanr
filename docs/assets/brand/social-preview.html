<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:640px;background:#08080C;overflow:hidden}
  .card{position:relative;width:1280px;height:640px;box-sizing:border-box;padding:72px 88px;color:#F4F4FA;font-family:"DM Sans",system-ui,sans-serif}
  .lockup{height:96px;display:block}
  h1{font-family:Outfit,system-ui,sans-serif;font-weight:600;font-size:64px;line-height:1.08;letter-spacing:-0.02em;margin:72px 0 0;max-width:980px}
  h1 em{font-style:normal;color:#5EEAD4}
  p{margin:28px 0 0;font-size:26px;line-height:1.35;color:#9999B8;max-width:900px}
  .foot{position:absolute;left:88px;right:88px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-family:"Source Code Pro",ui-monospace,monospace;font-size:22px;color:#5EEAD4}
  .foot span{color:#979EA8}
  .rule{position:absolute;left:88px;right:88px;bottom:120px;height:1px;background:#222236}
</style></head>
<body><div class="card">
  <img class="lockup" src="openplanr-lockup-on-dark.png" alt="OpenPlanr">
  <h1>Close the loop from<br><em>intent to delivery.</em></h1>
  <p>The open harness around your coding agent: plans as files in your repository, checks before you merge, and a record of what shipped. For Claude Code, Codex, and Cursor, with the <b style="color:#F4F4FA;font-weight:500">openplanr</b> CLI.</p>
  <div class="rule"></div>
  <div class="foot"><div>npm install -g openplanr</div><div><span>MIT · </span>github.com/openplanr/OpenPlanr</div></div>
</div></body></html>
