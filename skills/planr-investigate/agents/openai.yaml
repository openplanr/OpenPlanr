interface:
  display_name: "OpenPlanr Investigate"
  short_description: "Diagnose a bug, regression, error, failing test, or unexplained…"
  default_prompt: "Use $planr-investigate to diagnose a bug, regression, error, failing test, or unexplained behavior and optionally implement a bounded fix. Use whenever the user asks why something fails or asks to investigate, debug, or find a root cause, including before any fix and for a single file. Not for planned feature delivery."
policy:
  allow_implicit_invocation: true
