interface:
  display_name: "OpenPlanr Ship"
  short_description: "Implement an OpenPlanr plan, specification, task, or clearly…"
  default_prompt: "Use $planr-ship to implement an OpenPlanr plan, specification, task, or clearly stated request end to end in the current repository. Use whenever the user asks to build, implement, fix, finish, or ship local work, including a small or already accepted change and requests to plan and implement it. Invoke before editing files. Not for planning only, landing, or release."
policy:
  allow_implicit_invocation: true
