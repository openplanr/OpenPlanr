interface:
  display_name: "OpenPlanr Ship"
  short_description: "Implement an OpenPlanr plan, specification, task, or clearly…"
  default_prompt: "Use $planr-ship to implement an OpenPlanr plan, specification, task, or clearly stated request end to end in the current repository. Use when the user asks to build, implement, fix, finish, or ship local work, or to plan and implement an accepted change. Invoke before editing files for the requested change. Not for planning only, landing, release, or work handed to another coding agent."
