name: Version packages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: version-packages
  cancel-in-progress: false

jobs:
  version:
    # Opens or refreshes the "chore(release): version packages" PR whenever pending
    # changesets reach main. Needs the release GitHub App so the PR triggers CI.
    if: github.repository == 'openplanr/OpenPlanr' && vars.RELEASE_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages:ci
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          create-github-releases: false
          github-token: ${{ steps.app.outputs.token }}
      # The release PR carries the nightly evidence for its exact commit.
      - name: Run the nightly suites on the version PR branch
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nightly.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main
