name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    # Surfaced so the appended ledger-drift guard can gate on the release
    # finalization path. changesets/action's own `published` output is not
    # reliable here: scripts/publish-if-needed.mjs runs a raw `npm publish`,
    # which does not emit the "New tag:" markers the action parses, so
    # `published` stays false even on a real publish. `hasChangesets == 'false'`
    # is the same finalization signal the "Create GitHub Release" step below
    # already trusts.
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}

    # The release gate runs the same suite as CI, so it needs the same sibling
    # pipeline fixture. Without it the packed-install e2e test packs a
    # directory that does not exist, which surfaces as `spawnSync npm ENOENT`
    # and blocks the version PR.
    env:
      OPENPLANR_PIPELINE_ROOT: ${{ github.workspace }}/.ci/planr-pipeline

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout released pipeline fixture
        uses: actions/checkout@v6
        with:
          repository: openplanr/planr-pipeline
          ref: v0.41.0
          path: .ci/planr-pipeline

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # When changesets exist: creates a "Version Packages" PR
      # When no changesets: checks if current version has a release, creates one if not
      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          # Check if release already exists
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          # Extract latest changelog section (escape dots for regex safety)
          ESCAPED=$(echo "$VERSION" | sed 's/\./\\./g')
          NOTES=$(awk "/^## ${ESCAPED}/{found=1; next} /^## [0-9]/{if(found) exit} found" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target main

  # Non-blocking drift guard. The publish already happened in `release` above, so
  # this separate job never reverts or fails it. It turns the workflow run red
  # only when the marketplace ecosystem manifest still advertises a CLI version
  # older than the one just published to npm — the state where `planr upgrade
  # status` reports "aligned" while a newer release exists that users cannot
  # discover from inside the product.
  #
  # Runs only on the finalization path (hasChangesets == 'false') and only after
  # `release` succeeds, then confirms the version is actually live on npm before
  # comparing, so it acts solely on a real, published release.
  ledger-check:
    name: Marketplace ledger drift
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.has-changesets == 'false' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fail red when the marketplace manifest is behind the published CLI
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const released = pkg.version;

          // Confirm this run's version is actually live on npm. publish-if-needed
          // skips when the version already exists, so a finalization run does not
          // always publish; only reconcile against a version npm truly serves.
          let npmLatest;
          try {
            npmLatest = execFileSync('npm', ['view', `${pkg.name}@latest`, 'version'], {
              encoding: 'utf8',
            }).trim();
          } catch (error) {
            console.error(`Could not read npm latest for ${pkg.name}; ledger drift check could not run: ${error.message}`);
            process.exit(2);
          }
          if (npmLatest !== released) {
            console.log(`npm latest ${npmLatest} does not match this run's ${released}; no finalized publish to reconcile.`);
            process.exit(0);
          }

          // Authoritative published manifest.
          const manifestUrl = 'https://raw.githubusercontent.com/openplanr/marketplace/main/ecosystem.json';
          let advertised;
          try {
            const response = await fetch(manifestUrl);
            if (!response.ok) throw new Error(`status ${response.status}`);
            advertised = (await response.json())?.components?.cli?.version;
          } catch (error) {
            console.error(`Could not fetch the marketplace ecosystem manifest; ledger drift check could not run: ${error.message}`);
            process.exit(2);
          }

          // Three-way version comparison. The tested reference implementation is
          // the marketplace repo's scripts/check-published-drift.mjs (node --test
          // coverage for aligned / behind / ahead / could-not-run); this inline
          // check mirrors its "behind fails" direction for the CLI component and
          // fails visibly closed on any unparseable version.
          const core = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$/.exec(value ?? '');
            return match ? match.slice(1, 4).map(Number) : null;
          };
          const advertisedCore = core(advertised);
          const releasedCore = core(released);
          if (!advertisedCore || !releasedCore) {
            console.error(`Unparseable version (manifest cli ${advertised}, npm ${released}); ledger drift check could not run.`);
            process.exit(2);
          }

          let behind = false;
          for (let i = 0; i < 3; i += 1) {
            if (advertisedCore[i] < releasedCore[i]) { behind = true; break; }
            if (advertisedCore[i] > releasedCore[i]) { behind = false; break; }
          }

          if (behind) {
            console.error(
              `Marketplace ledger drift: openplanr ${released} is published to npm, but the ecosystem manifest still advertises cli ${advertised}. ` +
              `Users cannot discover ${released} until the marketplace two-PR ledger advances ecosystem.json (openplanr/marketplace).`,
            );
            process.exit(1);
          }
          console.log(`Marketplace manifest advertises cli ${advertised}; aligned with or ahead of published ${released}.`);
          NODE
