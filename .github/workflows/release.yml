# BL-010 Phase 4.7 — rewritten for the monorepo. This REPLACES the previous
# content of this file (root-`package.json`-version + `awk`-CHANGELOG +
# `gh release create` fallback logic), which is deleted entirely, not ported
# — see plan §2.4: changesets is the sole writer of `packages/*/package.json`,
# and a second "root version" writer would deadlock the first release PR.
#
# The two former whole-repo publishers — the old root `.github/workflows/publish.yml`
# (triggered on `release: published`, job id `publish`) and
# `packages/planr-pipeline/.github/workflows/publish.yml` (same trigger, same
# job id) — are both deleted. Their filename/job-id collision disappears
# because both are gone: this single workflow now publishes every changed
# publishable package (openplanr, planr-pipeline) atomically via
# `changesets/action@v1` + `npx changeset publish`.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # When changesets exist: creates/updates a "Version Packages" PR that
      # runs `version-packages` (`changeset version && node
      # scripts/sync-ecosystem.mjs && npm install --package-lock-only`), so
      # every generated pin and the lockfile land in the same PR as the
      # version bumps.
      # When no changesets remain (this PR was just merged): publishes via
      # `changeset publish`, which publishes every public package whose
      # version changed and, per `.changeset/config.json`'s
      # `privatePackages: { tag: true }`, tags (but does not publish to npm)
      # the private `@openplanr/skills-plugin` / `openplanr-marketplace`
      # packages too.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
