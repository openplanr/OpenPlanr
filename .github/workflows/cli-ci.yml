# BL-010 Phase 4: moved from .github/workflows/ci.yml (root) — filename
# package-prefixed for consistency with the rest of the consolidated
# workflow set. The `build` job id and its [20, 22] matrix are kept
# unchanged so existing branch-protection required checks keep reporting
# under the same name (plan Phase 6.7).
name: "CLI — CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      skills: ${{ steps.filter.outputs.skills }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute per-package change booleans
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # BL-010 Phase 4.4: deliberately NOT a top-level `paths:` filter on
          # this workflow's `on:` block — a path-filtered workflow that is
          # also a required check never reports on unrelated PRs and blocks
          # merges forever. This job always runs; only heavy jobs below are
          # gated on its outputs via `if:`.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          if [ -z "$BASE" ]; then
            echo "No usable merge base (new branch / first push) — treating everything as changed."
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          fi

          # NOTE: a here-string, NOT `echo "$CHANGED" | grep -Eq`. `grep -q` exits on
          # first match and closes the pipe while echo is still writing; under
          # `set -o pipefail` that SIGPIPE makes the pipeline return FAILURE even
          # though the pattern matched. It only bites once the file list is large
          # enough that echo has not finished — i.e. exactly on big changesets,
          # which would then silently skip every gated job.
          matches() { grep -Eq "$1" <<< "$CHANGED"; }
          {
            matches '^packages/OpenPlanr/' && echo "cli=true" || echo "cli=false"
            matches '^packages/planr-pipeline/' && echo "pipeline=true" || echo "pipeline=false"
            matches '^packages/skills/' && echo "skills=true" || echo "skills=false"
            matches '^packages/marketplace/' && echo "marketplace=true" || echo "marketplace=false"
            matches '^(package\.json|package-lock\.json|scripts/|\.github/workflows/|\.changeset/)' && echo "root=true" || echo "root=false"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/OpenPlanr
    env:
      OPENPLANR_PIPELINE_ROOT: ${{ github.workspace }}/.ci/planr-pipeline

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Checkout released pipeline fixture
        uses: actions/checkout@v6
        with:
          repository: openplanr/planr-pipeline
          ref: v0.39.0
          path: .ci/planr-pipeline

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      # BL-010 Phase 4.3(a): npm ci must run at the repo root — there is one
      # root lockfile for the whole npm-workspaces monorepo now.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint & format check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Coverage is a property of the code, not of the host, so it is measured
      # once rather than on every matrix leg. Instrumenting the whole suite is
      # expensive, and doing it on Windows — already the slowest platform for
      # this I/O-bound suite — pushed integration tests past their budget for
      # no additional signal.
      - name: Run coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: npm run test:coverage

      # BL-010 Phase 4.3(b): `uses:` steps ignore `defaults.run.working-directory`.
      # The package now lives at packages/OpenPlanr/, so the coverage output
      # path must be spelled out in full.
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: packages/OpenPlanr/coverage/
          retention-days: 14

      - name: Verify CLI runs
        run: node dist/cli/index.js --version

      - name: Packed artifact smoke test
        run: npm pack --dry-run

      - name: POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: PowerShell installer syntax
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null"
