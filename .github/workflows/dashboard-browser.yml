name: Dashboard Browser Tests

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'packages/cli/tests/dashboard/**'
      - 'packages/cli/tests/e2e/**'
      - 'packages/cli/scripts/run-dashboard-browser-tests.mjs'
      - 'packages/cli/vite.dashboard.fixture.config.ts'
      - 'packages/operate/**'
      - 'packages/pipeline/lib/dashboard/**'
      - 'packages/protocol/**'
      - 'scripts/dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dashboard-browser.yml'

concurrency:
  group: dashboard-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Generate workspace package assets
        run: npm run generate
      - name: Install the pinned browser
        run: npm exec --workspace=openplanr -- playwright install --with-deps chromium
      - name: Run dashboard browser verification against local workspace packages
        run: npm run test:browser --workspace=openplanr
        env:
          CI: 'true'
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dashboard-browser-diagnostics
          path: packages/cli/test-results/
          if-no-files-found: ignore
          retention-days: 14
