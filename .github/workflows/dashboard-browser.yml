name: Dashboard Browser Tests

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'packages/cli/tests/dashboard/**'
      - 'packages/cli/tests/e2e/**'
      - 'packages/cli/scripts/run-dashboard-browser-tests.mjs'
      - 'packages/cli/vite.dashboard.fixture.config.ts'
      - 'packages/operate/**'
      - 'packages/pipeline/lib/dashboard/**'
      - 'packages/protocol/**'
      - 'packages/canvas/**'
      - 'scripts/dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dashboard-browser.yml'

concurrency:
  group: dashboard-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Generate workspace package assets
        run: npm run generate
      - name: Install the pinned browser
        run: npm exec --workspace=openplanr -- playwright install --with-deps chromium
      - name: Run dashboard browser verification against local workspace packages
        run: npm run test:browser --workspace=openplanr
        env:
          CI: 'true'
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-browser-diagnostics
          path: packages/cli/test-results/
          if-no-files-found: ignore
          retention-days: 14

  canvas-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Generate workspace package assets
        run: npm run generate
      - name: Build workspace packages
        run: npm run build
      - name: Install the pinned browser
        run: npm exec --workspace=openplanr -- playwright install --with-deps chromium
      - name: Run canvas browser verification against local workspace packages
        run: npm run test:browser --workspace=@openplanr/canvas
        env:
          CI: 'true'
      - name: Preserve canvas browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canvas-browser-results
          path: packages/canvas/test-results/
          if-no-files-found: warn
          retention-days: 14
