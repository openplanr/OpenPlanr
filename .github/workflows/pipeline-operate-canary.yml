# BL-010 Phase 4: moved from packages/planr-pipeline/.github/workflows/operate-release-canary.yml.
# Schedule/workflow_dispatch triggered only — no `changes` gate for the same
# reason as pipeline-artifact-canary.yml (it verifies the *released*
# ecosystem, not this diff).
name: "Pipeline — Operating Board Release Canary"

on:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:
    inputs:
      pipeline_version:
        description: Optional exact pipeline version
        required: false
        type: string
      cli_version:
        description: Optional exact OpenPlanr version
        required: false
        type: string
      skills_version:
        description: Optional exact skills release
        required: false
        type: string
      marketplace_version:
        description: Optional exact marketplace release
        required: false
        type: string

permissions:
  contents: read

jobs:
  released-ecosystem:
    name: Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/planr-pipeline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install released CLI
        run: npm install --global openplanr@latest --no-audit --no-fund
      - name: Verify resolved Operating Board release
        env:
          PLANR_EXPECT_PIPELINE: ${{ inputs.pipeline_version }}
          PLANR_EXPECT_CLI: ${{ inputs.cli_version }}
          PLANR_EXPECT_SKILLS: ${{ inputs.skills_version }}
          PLANR_EXPECT_MARKETPLACE: ${{ inputs.marketplace_version }}
        run: npm run canary:operate-release
