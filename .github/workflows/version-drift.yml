# BL-010 Phase 4.8 — new workflow. Runs the root drift gates that make a
# stale pin structurally unrepresentable (plan §1: "Co-location + one atomic
# release + a sync-ecosystem.mjs that *generates* every pin makes a stale pin
# structurally unrepresentable"), plus the pipeline's own `doctor --strict`,
# which per plan §1 has never passed in this project's history until the
# generated-pin work landed in Phase 3.
name: Version drift gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Ecosystem drift + doctor --strict
    runs-on: ubuntu-latest
    # Belt-and-braces per plan Phase 3.5: point workspace-discovery's
    # environment override directly at packages/, since the git-remote
    # fallback is dead code in a single-.git monorepo checkout.
    env:
      OPENPLANR_ECOSYSTEM_ROOT: ${{ github.workspace }}/packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      # Chains check:ecosystem (scripts/sync-ecosystem.mjs --check) +
      # check:cross-refs (scripts/check-cross-refs.mjs — SKILL.md inlined
      # frontmatter vs pipeline JSON Schemas) + check:agent-divergence
      # (accepted-baseline gate for the vendored cursor/pipeline agent files,
      # plan Phase 3.7 — fails only on NEW drift, not the pre-existing gap).
      - name: Root drift gates (check:drift)
        run: npm run check:drift

      # BL-010 Phase 3.6 acceptance gate, re-asserted on every push/PR to main.
      - name: Pipeline doctor --strict
        working-directory: packages/planr-pipeline
        run: npm run doctor -- --strict
