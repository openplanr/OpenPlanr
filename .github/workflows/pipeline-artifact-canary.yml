# BL-010 Phase 4: moved from packages/planr-pipeline/.github/workflows/artifact-release-canary.yml.
# Schedule/workflow_dispatch triggered only — not gated behind the `changes`
# job pattern used by push/PR workflows, since a canary against the
# *released* ecosystem has no meaningful "changed files in this diff" concept
# and must always run when triggered.
name: "Pipeline — Artifact Release Canary"

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      room_url:
        description: Optional complete encrypted live-room URL for route validation
        required: false
        type: string

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/planr-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify released ecosystem and share origin
        env:
          PLANR_CANARY_ROOM_URL: ${{ inputs.room_url }}
        run: npm run canary:artifact-release
