name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build generated outputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Generate local distributions and verify tracked outputs
        run: |
          npm run generate
          git diff --exit-code HEAD --
      # Same pin as openplanr/marketplace's check, so the release PR there cannot fail first.
      - name: Validate the Claude plugin as the plugin directory's CLI does
        run: npx --yes @anthropic-ai/claude-code@2.1.284 plugin validate --strict dist/plugins/claude/openplanr
      - name: Build in dependency order without tracked drift
        run: |
          npm run build
          git diff --exit-code HEAD --
      - name: Require every output to be committed or git-ignored
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::Generated or built outputs are neither committed nor git-ignored, so build-outputs.tgz would omit them:"
            echo "$untracked"
            exit 1
          fi
      # A tarball keeps the executable bits that upload-artifact drops from generated skill scripts.
      - name: Pack the generated and built outputs for the test jobs
        run: |
          set -o pipefail
          git ls-files -z --others --ignored --exclude-standard --directory \
            | grep -zEv '(^|/)node_modules/$' \
            | tar --null -T - -czf "$RUNNER_TEMP/build-outputs.tgz"
          # The archive is a downloadable run artifact. --directory collapses fully ignored
          # folders, so check every member rather than the listing; grep exits 1 on no match.
          tar -tzf "$RUNNER_TEMP/build-outputs.tgz" > "$RUNNER_TEMP/build-outputs.members"
          sensitive="$(grep -E '(^|/)(\.env[^/]*|\.ci|\.planr|\.claude|\.git|logs)(/|$)|\.log$' "$RUNNER_TEMP/build-outputs.members")" || [ $? -eq 1 ]
          if [ -n "$sensitive" ]; then
            echo "::error::build-outputs.tgz would publish environment files, logs, or private state as a run artifact:"
            echo "$sensitive"
            exit 1
          fi
      - name: Pack exact public candidates for linked private Studio verification
        run: node scripts/release-train/pack-studio-candidate.mjs "$RUNNER_TEMP/studio-public-candidate"
      - uses: actions/upload-artifact@v6
        with:
          name: studio-public-candidate
          path: ${{ runner.temp }}/studio-public-candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: build-outputs
          path: ${{ runner.temp }}/build-outputs.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  quality:
    name: Node 24 generated, boundary, docs, lint, and type checks
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Keep private planning state untracked
        run: |
          tracked="$(git ls-files .planr)"
          if [ -n "$tracked" ]; then
            echo "::error::.planr/ is private planning state and must not be tracked. Run git rm --cached on:"
            echo "$tracked"
            exit 1
          fi
      - name: Verify generated custody
        run: npm run check:generated
      - name: Verify package and composition boundaries
        run: npm run check:boundaries
      - name: Lint the public documentation
        run: npm run check:docs
      - name: Lint the source comments
        run: npm run check:comments
      - name: Lint every participating workspace
        run: npm run lint
      - name: Type-check the hand-written declarations against their modules
        run: npm run typecheck:declarations
      - name: Verify the committed documentation diagram sets
        run: npm run check:diagrams

  supporting-package-tests:
    name: Node 24 supporting package tests
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Install Chromium for portable runtime tests
        uses: ./.github/actions/playwright-chromium
        timeout-minutes: 12
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Test protocol, operate, artifact, integrations, skill runtime, and dashboard
        env:
          PLANR_BROWSER_TESTS: 1
        run: |
          npm test --workspace=@openplanr/protocol
          npm test --workspace=@openplanr/operate
          npm test --workspace=@openplanr/artifact
          npm test --workspace=@openplanr/integrations
          npm test --workspace=@openplanr/skill-runtime
          npm test --workspace=@openplanr/dashboard-app

  design-tests:
    name: Node 24 design package tests
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Install Chromium for design tests
        uses: ./.github/actions/playwright-chromium
        timeout-minutes: 12
      - name: Test the design package
        run: npm test --workspace=@openplanr/design

  pipeline-tests:
    name: Node 24 pipeline ${{ matrix.suite }} tests
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: surface
            script: test:surface
          - suite: runtime orchestration
            script: test:orchestration:runtime
          - suite: ecosystem orchestration
            script: test:orchestration:ecosystem
          - suite: pipeline orchestration
            script: test:orchestration:pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Run pipeline suite
        run: npm run ${{ matrix.script }} --workspace=planr-pipeline

  cli-tests:
    name: Node 24 CLI tests (shard ${{ matrix.shard }}/6)
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Run CLI test shard
        working-directory: packages/cli
        run: npm run test:main -- --shard=${{ matrix.shard }}/6

  cli-heavy-tests:
    name: Node 24 CLI heavy tests
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Run CLI heavy tests
        working-directory: packages/cli
        run: npm run test:heavy

  cli-operate-boundary-tests:
    name: Node 24 CLI Operate boundary (${{ matrix.suite }})
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: command gateway
            script: test:operate-command-gateway
          - suite: planning bridge
            script: test:operate-planning-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Run the Operate boundary suite in a fresh process
        working-directory: packages/cli
        run: npm run ${{ matrix.script }}

  cli-runtime-integrity-tests:
    name: Node 24 runtime integrity tests
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Run runtime integrity tests in a fresh process
        working-directory: packages/cli
        run: npm run test:runtime-integrity

  compatibility:
    name: Node ${{ matrix.node }} contributor verification
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Install Chromium for local studio tests
        uses: ./.github/actions/playwright-chromium
        timeout-minutes: 12
      - name: Generate local distributions and verify tracked outputs
        run: |
          npm run generate
          git diff --exit-code HEAD --
      - name: Build in dependency order without tracked drift
        run: |
          npm run build
          git diff --exit-code HEAD --
      # Runs on its own generation rather than the build job's outputs, so these
      # suites start immediately instead of after the build.
      - name: Run focused integration tests
        run: npm run test:focused

  packed-public-packages:
    name: Node ${{ matrix.node }} packed public-package proof
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Install Chromium for packed Protocol browser verification
        uses: ./.github/actions/playwright-chromium
        timeout-minutes: 12
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Verify generated custody
        run: npm run check:generated
      - name: Select the published-package consumer runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Pack and install only public compatibility packages
        run: npm run verify:packed:strict
      - name: Verify landing owner-terminal custody on supported runtimes
        run: >-
          node --test --test-concurrency=1
          packages/pipeline/tests/pipeline/landing.test.mjs
          packages/pipeline/tests/pipeline/landing-adversarial.test.mjs
          packages/pipeline/tests/pipeline/landing-packed-install.test.mjs

  packed-public-packages-current:
    name: Node ${{ matrix.node }} packed public-package proof (non-blocking until LTS)
    needs: build
    if: ${{ !cancelled() }}
    # Node.js 26 is Current, not LTS, and the engines already admit it. A failure here shows
    # on the run without failing it or CI passed; fold 26 into the matrix above once it is LTS.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [26]
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Install Chromium for packed Protocol browser verification
        uses: ./.github/actions/playwright-chromium
        timeout-minutes: 12
      - uses: actions/download-artifact@v7
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Verify generated custody
        run: npm run check:generated
      - name: Select the published-package consumer runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Pack and install only public compatibility packages
        run: npm run verify:packed:strict
      - name: Verify landing owner-terminal custody on supported runtimes
        run: >-
          node --test --test-concurrency=1
          packages/pipeline/tests/pipeline/landing.test.mjs
          packages/pipeline/tests/pipeline/landing-adversarial.test.mjs
          packages/pipeline/tests/pipeline/landing-packed-install.test.mjs

  ci-passed:
    name: CI passed
    needs:
      - build
      - quality
      - supporting-package-tests
      - design-tests
      - pipeline-tests
      - cli-tests
      - cli-heavy-tests
      - cli-operate-boundary-tests
      - cli-runtime-integrity-tests
      - compatibility
      - packed-public-packages
    # always(), not !cancelled(): a skipped required check reports success, so this job
    # must run and fail when the workflow is cancelled.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Workspace CI job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results="$(printf '%s\n' "$NEEDS" | grep -E '"result": *"[a-z_]*"' || true)"
          if [ -z "$results" ] || printf '%s\n' "$results" | grep -qvE '"result": *"success"'; then
            echo "::error::Every Workspace CI job must succeed; a failed, cancelled or skipped job fails this check."
            printf '%s\n' "$NEEDS"
            exit 1
          fi
