name: Workspace CI

# No push trigger: the merge queue run already tests the exact commit that lands on main.
# A pull request runs only the test jobs its changed files reach; the merge queue runs them all.
# Integration suites, coverage, other Node versions and packed proofs run in nightly.yml.
on:
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select Workspace CI jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      design-tests: ${{ steps.select.outputs.design-tests }}
      supporting-package-tests: ${{ steps.select.outputs.supporting-package-tests }}
      skill-runtime-tests: ${{ steps.select.outputs.skill-runtime-tests }}
      pipeline-tests: ${{ steps.select.outputs.pipeline-tests }}
      cli-tests: ${{ steps.select.outputs.cli-tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: select
        name: Select jobs from the changed files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/changed-files"
          if [ "$EVENT_NAME" = pull_request ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/changed-files"
          fi
          node scripts/ci/workspace-jobs.mjs --event "$EVENT_NAME" --head-ref "$HEAD_REF" \
            --head-repo "$HEAD_REPO" --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/changed-files" \
            | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build generated outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Generate local distributions and verify tracked outputs
        run: |
          npm run generate
          git diff --exit-code HEAD --
      - name: Build in dependency order without tracked drift
        run: |
          npm run build
          git diff --exit-code HEAD --
      - name: Require every output to be committed or git-ignored
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::Generated or built outputs are neither committed nor git-ignored, so build-outputs.tgz would omit them:"
            echo "$untracked"
            exit 1
          fi
      # A tarball keeps the executable bits that upload-artifact drops from generated skill scripts.
      - name: Pack the generated and built outputs for the test jobs
        run: |
          set -o pipefail
          git ls-files -z --others --ignored --exclude-standard --directory \
            | grep -zEv '(^|/)node_modules/$' \
            | tar --null -T - -czf "$RUNNER_TEMP/build-outputs.tgz"
          # The archive is a downloadable run artifact. --directory collapses fully ignored
          # folders, so check every member rather than the listing; grep exits 1 on no match.
          tar -tzf "$RUNNER_TEMP/build-outputs.tgz" > "$RUNNER_TEMP/build-outputs.members"
          sensitive="$(grep -E '(^|/)(\.env[^/]*|\.ci|\.planr|\.claude|\.git|logs)(/|$)|\.log$' "$RUNNER_TEMP/build-outputs.members")" || [ $? -eq 1 ]
          if [ -n "$sensitive" ]; then
            echo "::error::build-outputs.tgz would publish environment files, logs, or private state as a run artifact:"
            echo "$sensitive"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}/build-outputs.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true


  # Runs beside the build so the critical path is the build plus the longest test lane.
  static:
    name: Node 24 static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Keep private planning state untracked
        run: |
          tracked="$(git ls-files .planr)"
          if [ -n "$tracked" ]; then
            echo "::error::.planr/ is private planning state and must not be tracked. Run git rm --cached on:"
            echo "$tracked"
            exit 1
          fi
      - name: Generate local distributions
        run: npm run generate
      - name: Build in dependency order
        run: npm run build
      # Same pin as openplanr/marketplace's check, so the release PR there cannot fail first.
      - name: Validate the Claude plugin as the plugin directory's CLI does
        run: npx --yes @anthropic-ai/claude-code@2.1.284 plugin validate --strict dist/plugins/claude/openplanr
      - name: Pack exact public candidates for linked private Studio verification
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/studio-public-candidate
        run: node scripts/release-train/pack-studio-candidate.mjs "$CANDIDATE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-public-candidate
          path: ${{ runner.temp }}/studio-public-candidate/
          if-no-files-found: error
      - name: Verify generated custody
        run: npm run check:generated
      - name: Verify package and composition boundaries
        run: npm run check:boundaries
      - name: Lint the public documentation
        run: npm run check:docs
      - name: Lint the source comments
        run: npm run check:comments
      - name: Lint every participating workspace
        run: npm run lint
      - name: Type-check the hand-written declarations against their modules
        run: npm run typecheck:declarations
      - name: Verify the committed documentation diagram sets
        run: npm run check:diagrams
      - name: Run the focused gates no package suite covers
        run: npm run test:focused
      # The queue run only needs this job to report; the review already ran on the pull request.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      # The queue re-reads the pull request, so a label removed after queueing still fails.
      # Its own file list keeps changesets from earlier queue entries out of the check.
      - name: Check changeset bumps against the title type
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          number="${PR_NUMBER:-$(printf '%s' "$QUEUE_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*#\1#p')}"
          if [ -z "$number" ]; then
            echo "::error::Cannot find the pull request number for ref '$QUEUE_REF'"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$number" > "$RUNNER_TEMP/pull.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$number/files" > "$RUNNER_TEMP/files.json"
          node scripts/release-train/check-changeset-bump.mjs --pr "$RUNNER_TEMP/pull.json" --files "$RUNNER_TEMP/files.json"
      # Last, because every later step would run on the minimum runtime.
      - name: Select the advertised Protocol minimum runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
      - name: Verify Protocol imports, schema generation and validation on the minimum
        env:
          OPENPLANR_PROTOCOL_FLOOR_EXECUTABLE: node
        run: node --test tests/protocol/protocol-runtime-floor.test.mjs

  design-tests:
    name: Node 24 design package tests
    needs: [build, changes]
    if: ${{ !cancelled() && needs.changes.outputs.design-tests == 'true' }}
    runs-on: ubuntu-24.04
    # The Playwright image carries the browsers and their system libraries, so no job waits on apt.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 12
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace belongs to the runner user and the container runs as root.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Test the design package
        run: npm test --workspace=@openplanr/design

  supporting-package-tests:
    name: Node 24 supporting package tests
    needs: [build, changes]
    if: ${{ !cancelled() && needs.changes.outputs.supporting-package-tests == 'true' }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 12
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace belongs to the runner user and the container runs as root.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Test protocol, canvas, operate, artifact, integrations, and dashboard
        env:
          PLANR_BROWSER_TESTS: 1
        run: |
          npm test --workspace=@openplanr/protocol
          npm test --workspace=@openplanr/canvas
          npm test --workspace=@openplanr/operate
          npm test --workspace=@openplanr/artifact
          npm test --workspace=@openplanr/integrations
          npm test --workspace=@openplanr/dashboard-app

  # The Playwright image has no make, which the skill runtime's structured checks run.
  skill-runtime-tests:
    name: Node 24 skill runtime tests
    needs: [build, changes]
    if: ${{ !cancelled() && needs.changes.outputs.skill-runtime-tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Test the skill runtime
        run: npm test --workspace=@openplanr/skill-runtime

  pipeline-tests:
    name: Node 24 pipeline ${{ matrix.suite }} tests
    needs: [build, changes]
    if: ${{ !cancelled() && needs.changes.outputs.pipeline-tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: surface and orchestration
            script: test:fast
          - suite: ecosystem orchestration
            script: test:orchestration:ecosystem
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Run pipeline suite
        run: npm run ${{ matrix.script }} --workspace=planr-pipeline

  cli-tests:
    name: Node 24 CLI tests (shard ${{ matrix.shard }}/3)
    needs: [build, changes]
    if: ${{ !cancelled() && needs.changes.outputs.cli-tests == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require the Build generated outputs job to have succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::Build generated outputs ended as '$BUILD_RESULT'; this job tests its outputs and cannot run without them."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-outputs
          path: ${{ runner.temp }}
      - name: Restore the generated runtime from the build job
        run: tar -xzmf "$RUNNER_TEMP/build-outputs.tgz"
      - name: Run CLI test shard
        working-directory: packages/cli
        run: npm run test:main -- --shard=${{ matrix.shard }}/3

  ci-passed:
    name: CI passed
    needs:
      - changes
      - build
      - static
      - design-tests
      - supporting-package-tests
      - skill-runtime-tests
      - pipeline-tests
      - cli-tests
    # always(), not !cancelled(): a skipped required check reports success, so this job
    # must run and fail when the workflow is cancelled.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected Workspace CI job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if ! printf '%s\n' "$NEEDS" | jq -e '.changes.outputs as $selected | length > 0 and
            all(to_entries[]; .value.result == "success" or
              (.value.result == "skipped" and $selected[.key] == "false"))' > /dev/null; then
            echo "::error::Every Workspace CI job must succeed, except a test job the change does not reach; a failed, cancelled or wrongly skipped job fails this check."
            printf '%s\n' "$NEEDS"
            exit 1
          fi
