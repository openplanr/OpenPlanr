# BL-010 Phase 4: moved from packages/planr-pipeline/.github/workflows/runtime-smoke.yml.
#
# BL-010 Phase 4.3(c): `$GITHUB_WORKSPACE` used to point at the pipeline's
# own repo root; it is now the monorepo root, so every reference to
# adapter/skill/conformance paths under the old repo root has to be
# re-pointed at packages/planr-pipeline/. The `claude-plan-ship` and
# `codex-plan-ship` jobs below get a job-level
# `defaults.run.working-directory: packages/planr-pipeline`, which fixes the
# `cp -R conformance/fixtures/...` steps and the final
# `conformance/runner.mjs --verify-ship` steps with no further edits (a
# step's own `working-directory:` — used by the two "smoke" steps that `cd`
# into `$RUNNER_TEMP/*-smoke` — always overrides a job-level default, so
# those two steps are untouched). The `--plugin-dir` and codex SKILL.md
# paths interpolate `$GITHUB_WORKSPACE` directly and are fixed explicitly
# below since job-level defaults do not affect env-var string content.
name: "Pipeline — Credentialed Runtime Smoke"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  release:
    types: [prereleased]

jobs:
  deterministic-guided-operate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/planr-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npm run canary:guided-operate

  claude-plan-ship:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/planr-pipeline
    steps:
      - name: Detect credential
        id: auth
        env:
          RUNTIME_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$RUNTIME_API_KEY" && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.auth.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.available == 'true'
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code
        if: steps.auth.outputs.available == 'true'
      - run: cp -R conformance/fixtures/spec-driven-todo-shipped "$RUNNER_TEMP/claude-smoke"
        if: steps.auth.outputs.available == 'true'
      - name: Native PLAN smoke
        if: steps.auth.outputs.available == 'true'
        working-directory: ${{ runner.temp }}/claude-smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude --plugin-dir "$GITHUB_WORKSPACE/packages/planr-pipeline" -p "/planr-pipeline:plan todo-feature --dry-run"
      - name: Native SHIP resume smoke
        if: steps.auth.outputs.available == 'true'
        working-directory: ${{ runner.temp }}/claude-smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude --plugin-dir "$GITHUB_WORKSPACE/packages/planr-pipeline" -p "/planr-pipeline:ship todo-feature"
      - run: node conformance/runner.mjs --runtime claude-code --verify-ship --dir "$RUNNER_TEMP/claude-smoke"
        if: steps.auth.outputs.available == 'true'

  codex-plan-ship:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/planr-pipeline
    steps:
      - name: Detect credential
        id: auth
        env:
          RUNTIME_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$RUNTIME_API_KEY" && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.auth.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.available == 'true'
        with:
          node-version: 22
      - run: npm install --global @openai/codex
        if: steps.auth.outputs.available == 'true'
      - run: cp -R conformance/fixtures/spec-driven-todo-shipped "$RUNNER_TEMP/codex-smoke"
        if: steps.auth.outputs.available == 'true'
      - name: Codex PLAN smoke
        if: steps.auth.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          codex exec --ephemeral --skip-git-repo-check --sandbox workspace-write
          -C "$RUNNER_TEMP/codex-smoke"
          "Follow $GITHUB_WORKSPACE/packages/planr-pipeline/adapters/codex/skills/planr-plan/SKILL.md and run PLAN for todo-feature in dry-run mode. Never invoke SHIP."
      - name: Codex SHIP smoke
        if: steps.auth.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          codex exec --ephemeral --skip-git-repo-check --sandbox workspace-write
          -C "$RUNNER_TEMP/codex-smoke"
          "Follow $GITHUB_WORKSPACE/packages/planr-pipeline/adapters/codex/skills/planr-ship/SKILL.md and run the reviewed SHIP resume for todo-feature."
      - run: node conformance/runner.mjs --runtime codex --verify-ship --dir "$RUNNER_TEMP/codex-smoke"
        if: steps.auth.outputs.available == 'true'
