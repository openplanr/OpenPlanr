name: Local Release Proof

on:
  workflow_dispatch: {}

concurrency:
  group: local-release-proof-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  proof:
    name: Node ${{ matrix.node }} immutable package proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium for local studio tests
        run: npm exec --workspace=@openplanr/protocol -- playwright install --with-deps chromium
      - name: Generate local distributions and verify tracked outputs
        run: |
          npm run generate
          git diff --exit-code HEAD --
      - name: Build in dependency order without tracked drift
        run: |
          npm run build
          git diff --exit-code HEAD --
      - name: Verify generated, boundary, focused, and packed gates
        run: npm run verify

      # This verification workflow has no publish, deployment, transfer, archive, or
      # remote-creation step. Publication is a separately approved action.
