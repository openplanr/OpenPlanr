# BL-010 Phase 4: moved from packages/planr-pipeline/.github/workflows/conformance.yml.
#
# BL-010 Phase 4.5 — managed-block removal. This file was previously wrapped
# in `##planr-devops-agent:begin##` / `##planr-devops-agent:end##` markers
# spanning the entire file, addressed to an LLM devops-agent expected to
# regenerate it wholesale. No generator script exists anywhere in this repo
# (scripts/, lib/, agents/, procedures/ were searched) — the markers were a
# dead regeneration bomb. Blind-regenerating this file today would clobber
# the monorepo-specific `working-directory: packages/planr-pipeline`
# defaults and the `changes` gate below, which do not exist in whatever
# template produced the original markers. The markers have been removed
# deliberately and are NOT to be restored. If a devops-agent is ever pointed
# at this file again, it must hand-reconcile against the monorepo layout in
# this comment, never wholesale-replace the file.
name: "Pipeline — Conformance"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      skills: ${{ steps.filter.outputs.skills }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute per-package change booleans
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          if [ -z "$BASE" ]; then
            echo "No usable merge base (new branch / first push) — treating everything as changed."
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          fi
          # NOTE: a here-string, NOT `echo "$CHANGED" | grep -Eq`. `grep -q` exits on
          # first match and closes the pipe while echo is still writing; under
          # `set -o pipefail` that SIGPIPE makes the pipeline return FAILURE even
          # though the pattern matched. It only bites once the file list is large
          # enough that echo has not finished — i.e. exactly on big changesets,
          # which would then silently skip every gated job.
          matches() { grep -Eq "$1" <<< "$CHANGED"; }
          {
            matches '^packages/OpenPlanr/' && echo "cli=true" || echo "cli=false"
            matches '^packages/planr-pipeline/' && echo "pipeline=true" || echo "pipeline=false"
            matches '^packages/skills/' && echo "skills=true" || echo "skills=false"
            matches '^packages/marketplace/' && echo "marketplace=true" || echo "marketplace=false"
            matches '^(package\.json|package-lock\.json|scripts/|\.github/workflows/|\.changeset/)' && echo "root=true" || echo "root=false"
          } >> "$GITHUB_OUTPUT"

  schema-validation:
    name: Schema validation
    needs: changes
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/planr-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build gate: syntax-check the conformance runner (zero-dep, stdlib only)
      - name: Build gate
        run: node --check conformance/runner.mjs

      # Test gate: JSON validity sweep on all schemas under schemas/v1.0.0/
      - name: Test gate
        run: |
          node -e "
            const fs=require('fs'),p=require('path');
            const d='schemas/v1.0.0';
            if(fs.existsSync(d)){
              for(const f of fs.readdirSync(d)){
                if(f.endsWith('.json')){
                  JSON.parse(fs.readFileSync(p.join(d,f),'utf-8'));
                }
              }
            }
            console.log('ok');
          "

      # Validate the bundled default-mode conformance fixture against the
      # v1.0.0 JSON Schemas. Mode is auto-detected by detectFixtureMode().
      - name: Validate default-mode fixture
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --validate-schema conformance/fixtures/default-mode/

  guided-operate:
    name: Guided operate (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/planr-pipeline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # BL-010 Phase 4.3(a): npm ci must run at the repo root.
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npm run test:guided-acceptance
      - run: npm run canary:guided-operate
      - run: npm run check:guided-adapters
