name: Windows installer guard

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  powershell-guard:
    name: Windows PowerShell 5.1 installer runtime guard
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Check the actual installer guard without package installation
        shell: powershell
        run: ./packages/cli/tests/fixtures/installer-node-guard.ps1
