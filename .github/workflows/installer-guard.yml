name: Windows installer guard

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  powershell-guard:
    name: Windows PowerShell 5.1 installer runtime guard
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the actual installer guard without package installation
        shell: powershell
        run: ./packages/cli/tests/fixtures/installer-node-guard.ps1
