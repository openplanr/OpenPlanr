name: Protocol minimum runtime

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: protocol-runtime-floor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-floor:
    name: Protocol imports on Node 22.13.0
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies with the development runtime
        run: npm ci
      - name: Generate owned Protocol projections with the development runtime
        run: node packages/protocol/scripts/generate-protocol-assets.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
      - name: Verify imports, schema generation and validation on the advertised minimum
        env:
          OPENPLANR_PROTOCOL_FLOOR_EXECUTABLE: node
        run: node --test tests/protocol/protocol-runtime-floor.test.mjs
