# BL-010 Phase 4: moved from packages/planr-pipeline/.github/workflows/ci-parallel-dispatch.yml.
#
# BL-010 Phase 4.5 — managed-block removal (see pipeline-conformance.yml's
# header comment for the full rationale: no generator script exists in this
# repo, and blind-regeneration would clobber the monorepo working-directory
# defaults added below). The `##planr-devops-agent:begin/end##` markers that
# used to wrap this whole file have been removed deliberately and must not
# be restored.
#
# BL-010 Phase 4.6 — the `npm install` + `npm test` steps that used to run
# here have been removed entirely: pipeline-tests.yml already runs the full
# `npm test` suite for every push/PR touching packages/planr-pipeline, and
# nothing left in this file needs installed node_modules (the ND1-ND4 fixture
# checks below only exercise the zero-dependency, stdlib-only
# conformance/runner.mjs, same as the build-gate syntax check).
name: "Pipeline — Native Dispatch Conformance (SPEC-014)"

# Runs on every push and PR so the SPEC-014 native-dispatch fixture assertions
# are always part of the merge gate. Does not duplicate jobs already in
# pipeline-tests.yml or pipeline-conformance.yml — those cover the existing
# schema/fixture suite.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      skills: ${{ steps.filter.outputs.skills }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute per-package change booleans
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          if [ -z "$BASE" ]; then
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          fi
          # NOTE: a here-string, NOT `echo "$CHANGED" | grep -Eq`. `grep -q` exits on
          # first match and closes the pipe while echo is still writing; under
          # `set -o pipefail` that SIGPIPE makes the pipeline return FAILURE even
          # though the pattern matched. It only bites once the file list is large
          # enough that echo has not finished — i.e. exactly on big changesets,
          # which would then silently skip every gated job.
          matches() { grep -Eq "$1" <<< "$CHANGED"; }
          {
            matches '^packages/OpenPlanr/' && echo "cli=true" || echo "cli=false"
            matches '^packages/planr-pipeline/' && echo "pipeline=true" || echo "pipeline=false"
            matches '^packages/skills/' && echo "skills=true" || echo "skills=false"
            matches '^packages/marketplace/' && echo "marketplace=true" || echo "marketplace=false"
            matches '^(package\.json|package-lock\.json|scripts/|\.github/workflows/|\.changeset/)' && echo "root=true" || echo "root=false"
          } >> "$GITHUB_OUTPUT"

  native-dispatch:
    name: SPEC-014 native-dispatch fixtures
    needs: changes
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/planr-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engine constraint in package.json (>=20).
          # Pin to an LTS release for reproducibility.
          node-version: "20"

      # ------------------------------------------------------------------ #
      # Build gate: syntax-check both conformance scripts.                  #
      # The runner is zero-dep (Node stdlib only); no npm install needed.   #
      # ------------------------------------------------------------------ #
      - name: Build gate (syntax check)
        run: |
          node --check conformance/runner.mjs
          node --check conformance/json-schema-validate.mjs

      # ------------------------------------------------------------------ #
      # SPEC-014 native-dispatch conformance fixtures (ND1-ND4).            #
      # Each step runs one fixture in isolation so failures are named in    #
      # the GitHub Actions log without masking sibling results.             #
      # All use --runtime claude-code --verify-ship per the QA proof.       #
      # ------------------------------------------------------------------ #

      - name: "Fixture ND1 — native parallel emission (one Agent call per ready task, no isolation)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/native-dispatch-nd1-parallel

      - name: "Fixture ND2 — advisory lock-list (shared lock-listed path does NOT serialize)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/native-dispatch-nd2-advisory-locklist

      - name: "Fixture ND3 — dependsOn ordering (dependent waits for its dependency)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/native-dispatch-nd3-dependson

      - name: "Fixture ND4 — per-task / single-task (exactly one Agent call per invocation)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/native-dispatch-nd4-per-task
