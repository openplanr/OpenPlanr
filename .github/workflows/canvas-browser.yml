name: Canvas Browser Tests

on:
  pull_request:
    paths:
      - 'packages/canvas/**'
      - 'packages/artifact/lib/artifact/ui/**'
      - 'packages/artifact/tests/diagram-editor*'
      - 'packages/artifact/tests/fixtures/diagram-editor-canvas.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/canvas-browser.yml'

concurrency:
  group: canvas-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canvas-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Generate workspace package assets
        run: npm run generate
      - name: Build workspace packages
        run: npm run build
      - name: Install the pinned browser
        run: npm exec --workspace=openplanr -- playwright install --with-deps chromium
      - name: Run canvas browser verification against local workspace packages
        run: npm run test:browser --workspace=@openplanr/canvas
        env:
          CI: 'true'
      - name: Preserve canvas browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canvas-browser-results
          path: packages/canvas/test-results/
          if-no-files-found: warn
          retention-days: 14
