name: Warm main caches

# Caches saved by merge queue runs are scoped to their gh-readonly-queue ref, so pull
# request and queue runs can restore only what a main run saved.
on:
  push:
    branches: [main]
    paths: [package-lock.json]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: warm-main-caches
  cancel-in-progress: true

jobs:
  warm:
    name: Save the npm and Chromium caches for main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the root lockfile
        run: npm ci
      - name: Install Chromium as Workspace CI does
        uses: ./.github/actions/playwright-chromium
        timeout-minutes: 12
