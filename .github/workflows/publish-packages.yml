name: Publish public packages

# Runs after every green Workspace CI merge queue run for main, once that commit has
# landed on main, and publishes whatever public package versions it declares but npm
# does not have yet, in dependency order, behind the single npm-release approval. It
# then tags, releases, and projects the Claude plugin into the public marketplace.
# workflow_dispatch keeps the manual path for one package or for all pending ones.
on:
  workflow_run:
    workflows: ['Workspace CI']
    types: [completed]
    # The merge queue tests the exact commit that lands, so publish from that run.
    branches: ['gh-readonly-queue/main/**']
  workflow_dispatch:
    inputs:
      package:
        type: choice
        required: true
        default: all-pending
        options: ['all-pending', '@openplanr/protocol', '@openplanr/canvas', 'planr-pipeline', 'openplanr']
      version:
        description: Exact reviewed package version (required for one package)
        type: string
        required: false
        default: ''
      tag:
        description: Approved npm distribution tag
        type: choice
        required: true
        default: latest
        options: [latest, next]

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'openplanr/OpenPlanr' && vars.NPM_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'merge_group'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      has_pending: ${{ steps.plan.outputs.has_pending }}
      pending: ${{ steps.plan.outputs.pending }}
      cli_pending: ${{ steps.plan.outputs.cli_pending }}
      tag: ${{ github.event.inputs.tag || 'latest' }}
    steps:
      # Queue CI finishes before the merge, and an ejected group never lands. Skipping is
      # safe: the next landed commit publishes everything still pending.
      - name: Wait for the tested commit to land on main
        id: landed
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const commit = process.env.RELEASE_COMMIT;
            const deadline = Date.now() + 15 * 60 * 1000;
            for (;;) {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `main...${commit}`,
                per_page: 1,
              });
              if (data.status === 'identical' || data.status === 'behind') {
                core.setOutput('landed', 'true');
                return;
              }
              // Queue merges fast-forward, so a commit main has diverged from cannot land.
              if (data.status === 'diverged' || Date.now() > deadline) {
                core.notice(`${commit} did not land on main (compare status ${data.status}); nothing published`);
                core.setOutput('landed', 'false');
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 20 * 1000));
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_dispatch' || steps.landed.outputs.landed == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'workflow_dispatch' || steps.landed.outputs.landed == 'true'
        with:
          node-version: 24
      - name: Decide which public packages still need publishing
        id: plan
        if: github.event_name == 'workflow_dispatch' || steps.landed.outputs.landed == 'true'
        env:
          RELEASE_PACKAGE: ${{ github.event.inputs.package || 'all-pending' }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$RELEASE_PACKAGE" = "all-pending" ]; then
            node scripts/release-train/plan-release.mjs --github-output
          else
            node scripts/release-train/plan-release.mjs --github-output --package "$RELEASE_PACKAGE" --version "$RELEASE_VERSION"
          fi

  verify:
    needs: plan
    if: needs.plan.outputs.has_pending == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require the successful exact-commit merge queue verification on main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              event: 'merge_group',
              head_sha: process.env.RELEASE_COMMIT,
              per_page: 20,
            });
            const verified = response.data.workflow_runs.find(
              (run) => run.status === 'completed' && run.conclusion === 'success',
            );
            if (!verified) {
              core.setFailed(`Workspace CI has not passed a merge queue run for exact commit ${process.env.RELEASE_COMMIT}`);
              return;
            }
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `main...${process.env.RELEASE_COMMIT}`,
              per_page: 1,
            });
            if (comparison.status !== 'identical' && comparison.status !== 'behind') {
              core.setFailed(`${process.env.RELEASE_COMMIT} is not on main (compare status ${comparison.status})`);
              return;
            }
            core.notice(`Reusing Workspace CI evidence from ${verified.html_url}`);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate && npm run build
      - run: git diff --exit-code HEAD --
      - name: Pack the pending packages with their publication proofs
        env:
          RELEASE_PENDING: ${{ needs.plan.outputs.pending }}
        run: node scripts/release-train/prepare-bundles.mjs "$RUNNER_TEMP/openplanr-npm" --pending "$RELEASE_PENDING"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-public-packages
          path: ${{ runner.temp }}/openplanr-npm/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-plugin
          path: dist/plugins/claude/openplanr/
          # The plugin manifest lives in .claude-plugin/, which the action drops by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-public-packages
          path: release
      - name: Publish in dependency order through npm trusted publishing
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: node scripts/release-train/publish-archives.mjs --bundles release --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Create package-qualified tags and GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-train/tag-and-release.mjs --bundles release --repo "$GITHUB_REPOSITORY" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-record
          path: release/published.json
          if-no-files-found: error
          retention-days: 90

  marketplace:
    needs: [plan, publish]
    if: vars.RELEASE_APP_ID != '' && needs.plan.outputs.cli_pending == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: openplanr
          repositories: marketplace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openplanr/marketplace
          token: ${{ steps.app.outputs.token }}
          path: marketplace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: claude-plugin
          path: plugin
      - name: Project the Claude plugin into the marketplace checkout
        run: node scripts/release-train/publish-marketplace.mjs --plugin plugin --marketplace marketplace
      - name: Publish the marketplace change
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DIRECT_PUSH: ${{ vars.MARKETPLACE_DIRECT_PUSH }}
        working-directory: marketplace
        run: |
          version=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          git add -A
          if git diff --cached --quiet; then
            echo "Marketplace already serves planr $version"
            exit 0
          fi
          git config user.name "openplanr-release[bot]"
          git config user.email "openplanr-release[bot]@users.noreply.github.com"
          git commit -q -m "feat(marketplace): serve planr $version"
          if [ "$DIRECT_PUSH" = "true" ]; then
            git push origin HEAD:main
          else
            branch="release/planr-$version"
            git push -f origin "HEAD:refs/heads/$branch"
            gh pr create -R openplanr/marketplace --base main --head "$branch" \
              --title "feat(marketplace): serve planr $version" \
              --body "Generated Claude plugin for openplanr@$version, projected by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
              || echo "PR already open for $branch"
          fi
