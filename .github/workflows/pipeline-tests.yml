# BL-010 Phase 4: moved from packages/planr-pipeline/.github/workflows/test.yml
# to the repo-root .github/workflows/ — GitHub only reads workflows at the
# repo root, so anything left under packages/*/.github/workflows/ never runs.
name: "Pipeline — Tests"

on:
  pull_request:
    branches: [main, master]

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
      skills: ${{ steps.filter.outputs.skills }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      root: ${{ steps.filter.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute per-package change booleans
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # BL-010 Phase 4.4: this matters here specifically — pipeline-tests
          # is 3 OS x 2 Node plus a macos-14 pinned-Chromium visual lane plus
          # a 3-browser sandbox matrix. Deliberately no top-level `paths:`
          # filter on the `on:` block above (a path-filtered workflow that is
          # also a required check never reports on unrelated PRs and blocks
          # merges forever); this job always runs and only gates the heavy
          # jobs below via `if:`.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi

          if [ -z "$BASE" ]; then
            echo "No usable merge base (new branch / first push) — treating everything as changed."
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          fi

          matches() { echo "$CHANGED" | grep -Eq "$1"; }
          {
            matches '^packages/OpenPlanr/' && echo "cli=true" || echo "cli=false"
            matches '^packages/planr-pipeline/' && echo "pipeline=true" || echo "pipeline=false"
            matches '^packages/skills/' && echo "skills=true" || echo "skills=false"
            matches '^packages/marketplace/' && echo "marketplace=true" || echo "marketplace=false"
            matches '^(package\.json|package-lock\.json|scripts/|\.github/workflows/|\.changeset/)' && echo "root=true" || echo "root=false"
          } >> "$GITHUB_OUTPUT"

  node:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    needs: changes
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/planr-pipeline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # BL-010 Phase 4.3(a): npm ci must run at the repo root — one root
      # lockfile for the whole workspace, not one per package.
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: node --check conformance/runner.mjs
      - run: node --check conformance/json-schema-validate.mjs
      - run: npm test
      - run: npm run check:artifact-shell
      - run: npm run test:artifact:exports
      - run: npm run conformance:artifact
      - run: npm pack --dry-run
      - name: Conformance fixtures (default + spec-driven)
        shell: bash
        run: |
          set -euo pipefail

          # default-mode (pre-SHIP): schema validation + verify-po only; no npm needed
          node conformance/runner.mjs --runtime cursor --validate-schema conformance/fixtures/default-mode
          node conformance/runner.mjs --runtime cursor --verify-po --dir conformance/fixtures/default-mode

          # default-mode-shipped (post-SHIP): npm ci, then schema validation + verify-ship
          npm ci --prefix conformance/fixtures/default-mode-shipped
          node conformance/runner.mjs --runtime cursor --validate-schema conformance/fixtures/default-mode-shipped
          node conformance/runner.mjs --runtime cursor --verify-ship --dir conformance/fixtures/default-mode-shipped

          # spec-driven-todo (pre-SHIP): schema validation + verify-po only
          node conformance/runner.mjs --runtime cursor --validate-schema conformance/fixtures/spec-driven-todo
          node conformance/runner.mjs --runtime cursor --verify-po --dir conformance/fixtures/spec-driven-todo

          # spec-driven-todo-shipped (post-SHIP): npm ci, then schema validation + verify-ship
          npm ci --prefix conformance/fixtures/spec-driven-todo-shipped
          node conformance/runner.mjs --runtime cursor --validate-schema conformance/fixtures/spec-driven-todo-shipped
          node conformance/runner.mjs --runtime cursor --verify-ship --dir conformance/fixtures/spec-driven-todo-shipped

  # PNG baselines are intentionally held to one pinned OS/browser lane because
  # the approved typography contract permits platform-native safe fallbacks.
  artifact-browser:
    name: Artifact browser + visual (macOS 14, Chromium)
    needs: changes
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.root == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/planr-pipeline
    env:
      PLANR_BROWSER_TESTS: "1"
      PLANR_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npx playwright install chromium
      - run: npm run check:artifact-shell
      - run: npm run test:artifact:browser

  # Security behavior is certified across Playwright's three browser engines.
  # Pixel baselines stay in the pinned Chromium lane above to avoid
  # platform-font rendering noise.
  artifact-sandbox:
    name: Artifact sandbox (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/planr-pipeline
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLANR_BROWSER_TESTS: "1"
      PLANR_REQUIRE_BROWSER: "1"
      PLANR_BROWSER_ENGINE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node --test tests/artifact/sandbox-hostile.test.mjs
