name: Feature request
description: Propose a new capability or a change to an existing one.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want. Name the skill or command if you have one in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skills (planning, review, design, diagrams, operate)
        - planr CLI
        - Host integration (Claude Code, Codex, Cursor)
        - Trackers (GitHub Issues, Linear)
        - Protocol or packages
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
