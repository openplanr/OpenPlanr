name: Documentation
description: Something in the docs is wrong, missing, or unclear.
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Path or URL of the page.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
