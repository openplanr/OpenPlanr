name: Release check

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verify tag and marketplace versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const marketplace = require('./.claude-plugin/marketplace.json');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (pkg.version !== tag) throw new Error(`tag ${tag} != package ${pkg.version}`);
          if (marketplace.metadata.version !== tag) throw new Error(`tag ${tag} != marketplace ${marketplace.metadata.version}`);
          NODE
