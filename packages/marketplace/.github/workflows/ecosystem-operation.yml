name: Ecosystem operation ledger

on:
  pull_request:
    paths:
      - 'ecosystem.json'
      - 'examples/ecosystem-operation.json'
      - 'examples/guided-operate-operation.json'
      - 'examples/native-operate-operation.json'
      - 'examples/agentic-operate-operation.json'
      - 'examples/field-fix-operate-operation.json'
      - 'examples/outputs-epic-loop-operation.json'
      - 'examples/operate-agent-harness-operation.json'
      - 'examples/agent-native-operate-operation.json'
      - 'examples/agent-native-operate-forward-fix-operation.json'
      - 'examples/agent-native-operate-pipeline-reconciliation-operation.json'
      - 'operations/**'
      - 'schemas/ecosystem-operation.schema.json'
      - 'scripts/generate-ecosystem.mjs'
      - 'scripts/operating-canary-evidence.mjs'
      - 'scripts/operating-capability.mjs'
      - 'scripts/reconcile-operation.mjs'
      - 'scripts/validate-operation.mjs'
      - 'tests/ecosystem-operation.test.mjs'
      - 'tests/ecosystem-reconciliation.test.mjs'
      - 'tests/operating-canary-evidence.test.mjs'
      - 'tests/operating-capability.test.mjs'
      - 'tests/guided-operate-capability.test.mjs'
      - '.github/workflows/ecosystem-operation.yml'
      - '.github/workflows/operating-canary.yml'
      - '.github/workflows/guided-operate-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:operations
      - run: npm test
