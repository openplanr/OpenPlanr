name: Guided Operating Board canary

on:
  workflow_dispatch:
    inputs:
      pipeline_commit:
        description: Exact 40-character planr-pipeline commit SHA
        required: true
        type: string
      cli_commit:
        description: Exact 40-character OpenPlanr commit SHA
        required: true
        type: string
      skills_commit:
        description: Exact 40-character skills commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  guided-operate:
    name: Guided operate (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: marketplace
      - uses: actions/checkout@v4
        with:
          repository: openplanr/planr-pipeline
          ref: ${{ inputs.pipeline_commit }}
          path: planr-pipeline
      - uses: actions/checkout@v4
        with:
          repository: openplanr/OpenPlanr
          ref: ${{ inputs.cli_commit }}
          path: OpenPlanr
      - uses: actions/checkout@v4
        with:
          repository: openplanr/skills
          ref: ${{ inputs.skills_commit }}
          path: skills
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            planr-pipeline/package-lock.json
            OpenPlanr/package-lock.json
      - run: npm --prefix planr-pipeline ci
      - run: npm --prefix OpenPlanr ci
      - name: Build the exact CLI release source before packed-install checks
        run: npm --prefix OpenPlanr run build
      - name: Verify guided contracts, parity, and first-preview budget
        run: |
          npm --prefix planr-pipeline run test:guided-acceptance
          npm --prefix planr-pipeline run canary:guided-operate
          npm --prefix planr-pipeline run check:guided-adapters
      - name: Verify CLI guided lifecycle, authority, evidence recovery, and packed install
        env:
          OPENPLANR_PIPELINE_ROOT: ${{ github.workspace }}/planr-pipeline
        run: |
          npm --prefix OpenPlanr run test:operate:guided
          npm --prefix OpenPlanr run test:operate:security
      - name: Verify generated public skill
        run: npm --prefix skills test
      - name: Verify marketplace remains withheld until final reconciliation
        env:
          OPENPLANR_ECOSYSTEM_ROOT: ${{ github.workspace }}
        run: |
          npm --prefix marketplace run generate
          npm --prefix marketplace run check
          npm --prefix marketplace test

  evidence:
    name: Immutable release evidence
    needs: guided-operate
    if: ${{ always() && needs.guided-operate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: marketplace
      - name: Materialize digest-bound evidence
        run: >-
          node marketplace/scripts/materialize-operating-canary.mjs
          --directory evidence
          --pipeline-commit "${{ inputs.pipeline_commit }}"
          --cli-commit "${{ inputs.cli_commit }}"
          --skills-commit "${{ inputs.skills_commit }}"
          --run-id "${{ github.run_id }}"
          --repository "${{ github.repository }}"
      - name: Create validated canary report
        run: >-
          node marketplace/scripts/operating-canary-evidence.mjs
          --directory evidence
          --output guided-operating-canary-report.json
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: guided-operating-canary-report
          path: guided-operating-canary-report.json
          if-no-files-found: error
          retention-days: 90
