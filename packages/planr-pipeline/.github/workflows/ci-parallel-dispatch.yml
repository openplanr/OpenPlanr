# ##planr-devops-agent:begin## (managed block — re-generated by DevOps Agent for SPEC-013; preserve hand-edits outside this block)
name: Parallel Dispatch Conformance (SPEC-013)

# Runs on every push and PR so the 9 SPEC-013 fixture assertions are always
# part of the merge gate.  Does not duplicate jobs already in test.yml or
# conformance.yml — those cover the existing schema/fixture suite.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  parallel-dispatch:
    name: SPEC-013 parallel-dispatch fixtures
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engine constraint in package.json (>=20).
          # Pin to an LTS release for reproducibility.
          node-version: "20"

      # ------------------------------------------------------------------ #
      # Build gate: syntax-check both conformance scripts.                  #
      # The runner is zero-dep (Node stdlib only); no npm install needed.   #
      # ------------------------------------------------------------------ #
      - name: Build gate (syntax check)
        run: |
          node --check conformance/runner.mjs
          node --check conformance/json-schema-validate.mjs

      # ------------------------------------------------------------------ #
      # Test gate: existing schema + orchestration unit tests.               #
      # npm install is fine for the dev test harness (devDeps only).        #
      # ------------------------------------------------------------------ #
      - name: Install dev dependencies
        run: npm install

      - name: Unit tests (npm test)
        run: npm test

      # ------------------------------------------------------------------ #
      # SPEC-013 parallel-dispatch conformance fixtures (9 total).          #
      # Each step runs one fixture in isolation so failures are named in    #
      # the GitHub Actions log without masking sibling results.             #
      # All use --runtime claude-code --verify-ship per the QA proof.      #
      # ------------------------------------------------------------------ #

      - name: "Fixture G1 — multi-wave scheduling"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-g1-multi-wave

      - name: "Fixture G2 — floor-of-1 (single task per wave)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-g2-floor-of-1

      - name: "Fixture G7 — file-scoped merge (task .md excluded)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-g7-merge-scope

      - name: "Fixture A — clobber prevention (overlapping write-sets serialized)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-fixture-a-clobber-prevention

      - name: "Fixture C — undeclared-write rejection (whole worktree withheld)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-fixture-c-undeclared-write

      - name: "Fixture D — cyclic dependency fatal (exit 2, zero dispatch)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-fixture-d-cyclic-dep

      - name: "Fixture G4 — sequential parity (--max-parallel 1 byte-for-byte match)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-g4-sequential-parity

      - name: "Fixture G3 — --max-parallel argument validation"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-g3-arg-validation

      - name: "Fixture G6 — crash recovery (re-queue, skip done, prune stale)"
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --verify-ship \
            --dir conformance/fixtures/parallel-dispatch-g6-crash-recovery
# ##planr-devops-agent:end##
