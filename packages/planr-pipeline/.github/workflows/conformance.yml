# ##planr-devops-agent:begin## (managed block — re-generated by DevOps Agent; preserve hand-edits outside this block)
name: Conformance

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  conformance:
    name: Schema conformance — SPEC-001
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build gate: syntax-check the conformance runner (zero-dep, stdlib only)
      - name: Build gate
        run: node --check conformance/runner.mjs

      # Test gate: JSON validity sweep on all schemas under schemas/v1.0.0/
      - name: Test gate
        run: |
          node -e "
            const fs=require('fs'),p=require('path');
            const d='schemas/v1.0.0';
            if(fs.existsSync(d)){
              for(const f of fs.readdirSync(d)){
                if(f.endsWith('.json')){
                  JSON.parse(fs.readFileSync(p.join(d,f),'utf-8'));
                }
              }
            }
            console.log('ok');
          "

      # Schema validation: validate the default-mode conformance fixture
      # (spec-todo + us-1 + task-1 + fixture-local stack.md) against the
      # v1.0.0 JSON Schemas. Mode is auto-detected by detectFixtureMode().
      - name: Validate default-mode fixture
        run: |
          node conformance/runner.mjs \
            --runtime claude-code \
            --validate-schema conformance/fixtures/default-mode/
# ##planr-devops-agent:end##
