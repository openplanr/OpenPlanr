name: Artifact release canary

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      room_url:
        description: Optional complete encrypted live-room URL for route validation
        required: false
        type: string

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify released ecosystem and share origin
        env:
          PLANR_CANARY_ROOM_URL: ${{ inputs.room_url }}
        run: npm run canary:artifact-release
