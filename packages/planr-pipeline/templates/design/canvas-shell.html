<!doctype html>
<!--
  CANVAS shell — a Figma-like pan/zoom board of artboards (DesignCanvas).

  Self-contained + offline: the vendored React UMD + the precompiled
  DesignCanvas.js are copied alongside this file by the generator (see
  templates/design/vendor/). No CDN, no in-browser transpiler.

  HONEST VIEW-ONLY MODEL (SPEC-015 finding F3): editing/persistence needs a
  host bridge (window.__canvasHost) that does NOT exist when you just open this
  file. So when the host bridge is absent we DISABLE the edit affordances (reorder grips,
  rename, delete) rather than letting them silently discard changes — and we
  keep Export (PNG/HTML) as the primary action. A detached canvas is an honest
  shareable export surface, not a broken editor.

  Generator contract:
   • Replace GENERATOR:data with embedJson()-encoded canvas data (see shape
     below). embedJson() is mandatory — it neutralizes </script> and U+2028/9
     in any spec-derived string (SPEC-015 S1). Never hand-concatenate strings.
   • Shape (v0.17.0):
       { css?,                                  // shared design-system CSS, injected ONCE
         sections: [ { id, title, subtitle?, artboards: [
           { id, label, width, height, html }   // html = markup-only (uses the shared css)
       ] } ] }
   • Breakpoint frames: one SECTION per screen with three artboards — Desktop 1440×1024,
     Tablet 834×1194, Mobile 390×844 — sharing the screen's html; the @container rules in
     `css` reflow it per frame (design-step2-generate.md C.0.6 / C.4). lib/design/lint.mjs
     (lintCanvasData) fails any off-canonical frame.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><!-- GENERATOR:title -->Design canvas</title>
  <style>
    html, body { margin: 0; height: 100%; }
    /* View-only: disable edit affordances, keep Export. */
    body.dc-viewonly .dc-grip { pointer-events: none; opacity: .25; }
    body.dc-viewonly .dc-labeltext .dc-editable,
    body.dc-viewonly .dc-sectionhead .dc-editable { pointer-events: none; }
    body.dc-viewonly .dc-danger { display: none; }

    .dc-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: none; align-items: center; gap: 12px; padding: 8px 16px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #5a4a2a; background: #fef4a8; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
    body.dc-viewonly .dc-banner { display: flex; }
    .dc-banner code { background: rgba(0,0,0,.07); padding: 2px 8px; border-radius: 4px; }
    .dc-banner .x { margin-left: auto; cursor: pointer; border: 0; background: transparent; font-size: 16px; color: inherit; line-height: 1; }
    .dc-banner.dismissed { display: none !important; }
  </style>
</head>
<body>
  <div class="dc-banner" id="dc-banner" role="status">
    <strong>View-only.</strong>
    This canvas isn't connected to a project, so reordering/renaming won't save — but
    <strong>Export PNG/HTML</strong> works. To edit, run
    <code>/planr-pipeline:design &lt;slug&gt; --format canvas</code> from your project.
    <button class="x" aria-label="Dismiss" onclick="this.parentNode.classList.add('dismissed')">×</button>
  </div>
  <div id="root"></div>

  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/DesignCanvas.js"></script>
  <script>
    (function () {
      var DATA = /* GENERATOR:data */ { sections: [] };

      // Shared design-system stylesheet (v0.17.0): injected once so every
      // breakpoint frame (desktop/tablet/mobile) styles identically and each
      // artboard's html stays markup-only.
      if (DATA.css) {
        var dsStyle = document.createElement('style');
        dsStyle.textContent = DATA.css;
        document.head.appendChild(dsStyle);
      }

      // View-only unless a host bridge is present (it never is for a plain file open).
      if (!window.__canvasHost) document.body.classList.add('dc-viewonly');

      var h = React.createElement;
      function artboard(a) {
        return h(window.DCArtboard, { key: a.id, id: a.id, label: a.label, width: a.width, height: a.height },
          h('div', { style: { width: '100%', height: '100%', overflow: 'auto' },
            dangerouslySetInnerHTML: { __html: a.html || '' } }));
      }
      function section(s) {
        return h(window.DCSection, { key: s.id, id: s.id, title: s.title, subtitle: s.subtitle },
          (s.artboards || []).map(artboard));
      }
      var tree = h(window.DesignCanvas, null, (DATA.sections || []).map(section));

      var mount = document.getElementById('root');
      if (ReactDOM.createRoot) ReactDOM.createRoot(mount).render(tree);
      else ReactDOM.render(tree, mount); // React 17 fallback
    })();
  </script>
</body>
</html>
