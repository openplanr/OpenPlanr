<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas engine bench</title>
    <script>
      window.addEventListener('error', (event) => {
        window.benchError ??= event.error instanceof Error
          ? event.error.message
          : event.message || `Bench resource failed: ${event.target?.src || event.target?.href || 'unknown'}`;
      }, true);
      window.addEventListener('unhandledrejection', (event) => {
        window.benchError ??= event.reason instanceof Error ? event.reason.message : String(event.reason);
      });
    </script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; font: 14px system-ui, sans-serif; }
      #stage { width: 100%; height: 100%; background: #f5f6f8; }
      .card { position: absolute; box-sizing: border-box; border: 1px solid #b7bfca; border-radius: 6px; background: white; padding: 10px; }
      .card strong, .card span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card span { color: #536171; margin-top: 6px; }
      .edges, .svg-stage { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .edges { pointer-events: none; }
      #editable { position: fixed; right: 16px; bottom: 16px; }
      .canvas-frame-done { z-index: 20; }
    </style>
  </head>
  <body>
    <main id="stage" class="canvas-stage" tabindex="0" aria-label="Canvas engine bench"></main>
    <input id="editable" aria-label="Editable shortcut target" />
    <script type="module" src="./main.ts"></script>
  </body>
</html>
